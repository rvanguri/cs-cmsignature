# Python environment for the manuscript pipeline (stages 03-06, the figure, and the
# verification harness). The R stages (01, 01b, 02) use environment-R.yml.
#
#   mamba env create -f environment.yml
#   mamba env create -f environment-R.yml
#   PYTHON=$(conda run -n cs-cmsig-py which python) \
#   RSCRIPT=$(conda run -n cs-cmsig-r which Rscript) \
#     bash scripts/spatial_first/run_all.sh
#
name: cs-cmsig-py
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - numpy
  - scipy
  - statsmodels          # BH correction in the concordance / control stages
  - matplotlib
  - pip
  - pip:
      - adjustText       # label placement in Figure 1A
  # Optional, not needed to reproduce anything committed here:
  #   openpyxl  - only to re-derive data/published/chaffin2022_*.tsv from the
  #               publication's Excel supplement (06_published_reference.py --src-dir)
  #   scanpy, anndata - only for stage 00, which exports
  #               data/spatial_first/pseudobulk_T2000.tsv.gz from the raw Visium
  #               objects (not redistributed; see docs/data_availability.md)
