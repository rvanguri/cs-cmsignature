# R environment for the R stages of scripts/eschf/run_pipeline.sh
# (limma-voom fits and refits, patient pseudobulk, the A2 mixed model, snRNA study means).
#
#   mamba env create -f environment-R.yml
#
# Verified (865 claims reproduce) with R 4.5.3, limma 3.66.0, edgeR 4.8.2,
# lme4 2.0.6, lmerTest 3.2.1.
name: cs-cmsig-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  - bioconductor-limma
  - bioconductor-edger
  - r-lme4               # a2_model.R
  - r-lmertest           # a2_model.R
